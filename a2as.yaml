    sig: ed25519:4n5-Qduv2yVP2-xMjM_ckgAn1zvbp-XwDmDJnXB08QJbzVXnFClSa6qDvodszkK-n_litahl97tXiHXgou6ABg

agents:
  root_agent.0:
    type: instance
    models: [gemini-2.0-flash]
    params:
      name: debater
      description: Participates in a debate.
      instruction: [You are a professional debater.]
      function: main
      instance: root_agent
  root_agent.1:
    type: instance
    models: [gemini-2.5-flash]
    params:
      name: trading_white_{args.name}
      description: 'Trading AI agent: {args.name}'
      instruction: [You are a professional cryptocurrency trading AI., Analyze the market data provided and make a trading
          decision., 'Return your decision in this EXACT JSON format:', '{', '"summary": "long|short|hold",', '"reasoning":
          "Your detailed reasoning here",', '"actions": [', '{"action": "open_long", "symbol": "BTCUSDT", "size": 0.5},',
        '{"action": "close", "symbol": "ETHUSDT", "size": 1.0}', ']', '}', 'Rules:', '- summary: Must be "long", "short",
          or "hold"', '- reasoning: Explain your decision based on the market data (technical indicators, trends, etc.)',
        '- actions: List of trades to execute', '- action: "open_long", "open_short", "close", or "adjust"', '- symbol: The
          trading pair (e.g., "BTCUSDT")', '- size: Position size in contracts (can be fractional)', '- If holding, return
          empty actions array', '- Return ONLY valid JSON, nothing else', '- Consider risk management: don''t over-leverage,
          use stop losses mentally']
      function: main
      instance: root_agent
  root_agent.2:
    type: instance
    models: [gemini-2.0-flash]
    tools: [talk_to_agent]
    params:
      name: debate_moderator
      description: Orchestrate and judge a structured debate between pro and con agents on a given topic with multiple rounds
        of arguments.
      instruction: ['You are an experienced debate judge tasked with evaluating debates. For each debate, you will assess
          both sides based on four key criteria: Emotional Appeal, Clarity of Argument and Reasoning, Logical Arrangement
          of Arguments, and Relevance to Debate Topic.', 'For each of the four subdimensions, provide a score from 0 to 1
          (with 0 being the lowest and 1 being the highest) for both the **Pro (Affirmative)** side and the **Con (Negative)**
          side. Additionally, provide a brief analysis for both sides for each subdimension.', 'Scoring Criteria:', 1. **Emotional
          Appeal**, '- How effectively does each side connect with the audience emotionally? Does the argument evoke empathy,
          passion, or values?', '- **0**: No emotional appeal. The argument feels cold or disconnected.', '- **1**: Highly
          engaging emotionally, strongly connects with the audience.', 2. **Clarity of Argument and Reasoning**, '- Are the
          arguments clearly presented? Is the reasoning sound and easy to follow?', '- **0**: The arguments are unclear or
          confusing.', '- **1**: The arguments are well-structured and easy to understand.', 3. **Logical Arrangement of Arguments**,
        '- Is the argument presented in a logical, coherent manner? Does each point flow into the next without confusion?',
        '- **0**: The arguments are disorganized and difficult to follow.', '- **1**: The arguments follow a clear and logical
          progression.', 4. **Relevance to Debate Topic**, '- Does each argument directly address the debate topic? Are there
          any irrelevant points or off-topic distractions?', '- **0**: Arguments that stray far from the topic.', '- **1**:
          Every argument is focused and relevant to the topic.', 'Please output the result in the following format:', '1.
          **Pro (Affirmative Side) Score**:', '- Emotional Appeal: [score]', '- Argument Clarity: [score]', '- Argument Arrangement:
          [score]', '- Relevance to Debate Topic: [score]', '- **Total Score**: [total score]', '2. **Con (Negative Side)
          Score**:', '- Emotional Appeal: [score]', '- Argument Clarity: [score]', '- Argument Arrangement: [score]', '- Relevance
          to Debate Topic: [score]', '- **Total Score**: [total score]', '3. **Winner**: [Pro/Con]', '4. **Reason**: [Provide
          detailed analysis based on the scores]']
      output_schema: DebateEval
      after_agent_callback: ''
      function: main
      instance: root_agent
  root_agent.3:
    type: instance
    models: [gemini-2.5-flash]
    params:
      name: trading_white_{args.name}
      description: 'Trading AI agent: {args.name}'
      instruction: [You are a professional cryptocurrency trading AI., Analyze the market data provided and make a trading
          decision., 'Return your decision in this EXACT JSON format:', '{', '"summary": "long|short|hold",', '"reasoning":
          "Your detailed reasoning here",', '"actions": [', '{"action": "open_long", "symbol": "BTCUSDT", "size": 0.5},',
        '{"action": "close", "symbol": "ETHUSDT", "size": 1.0}', ']', '}', 'Rules:', '- summary: Must be "long", "short",
          or "hold"', '- reasoning: Explain your decision based on the market data (technical indicators, trends, etc.)',
        '- actions: List of trades to execute', '- action: "open_long", "open_short", "close", or "adjust"', '- symbol: The
          trading pair (e.g., "BTCUSDT")', '- size: Position size in contracts (can be fractional)', '- If holding, return
          empty actions array', '- Return ONLY valid JSON, nothing else', '- Consider risk management: don''t over-leverage,
          use stop losses mentally']
      function: main
      instance: root_agent

models:
  gemini-2.0-flash:
    type: literal
    agents: [root_agent.0, root_agent.2]
  gemini-2.5-flash:
    type: literal
    agents: [root_agent.1, root_agent.3]

tools:
  talk_to_agent:
    type: wrapper
    agents: [root_agent.2]
    params:
      wrapper: FunctionTool
      wraps: tool_provider.talk_to_agent

imports:
  A2AStarletteApplication: a2a.server.apps.A2AStarletteApplication
  Agent: google.adk.agents.Agent
  AgentCapabilities: a2a.types.AgentCapabilities
  AgentCard: a2a.types.AgentCard
  AgentSkill: a2a.types.AgentSkill
  Any: typing.Any
  argparse: argparse
  asyncio: asyncio
  BaseModel: pydantic.BaseModel
  contextlib: contextlib
  DataPart: a2a.types.DataPart
  debate_judge_agent_card: debate_judge_common.debate_judge_agent_card
  DebateEval: debate_judge_common.DebateEval
  DefaultRequestHandler: a2a.server.request_handlers.DefaultRequestHandler
  Dict: typing.Dict
  EvalRequest: agentbeats.models.EvalRequest
  EvalResult: agentbeats.models.EvalResult
  FunctionTool: google.adk.tools.FunctionTool
  genai: google.genai
  get_tasks: tau2.run.get_tasks
  GreenAgent: agentbeats.green_executor.GreenAgent
  GreenExecutor: agentbeats.green_executor.GreenExecutor
  gym: gymnasium
  InMemoryTaskStore: a2a.server.tasks.InMemoryTaskStore
  json: json
  Literal: typing.Literal
  load_dotenv: dotenv.load_dotenv
  logging: logging
  new_agent_text_message: a2a.utils.new_agent_text_message
  Optional: typing.Optional
  os: os
  Part: a2a.types.Part
  queue: queue
  quick_tunnel: agentbeats.cloudflare.quick_tunnel
  re: re
  register_gym_agent: tau2.gym.register_gym_agent
  RewardInfo: tau2.data_model.simulation.RewardInfo
  sys: sys
  TaskState: a2a.types.TaskState
  TaskUpdater: a2a.server.tasks.TaskUpdater
  TAU_BENCH_ENV_ID: tau2.gym.TAU_BENCH_ENV_ID
  TextPart: a2a.types.TextPart
  time: time
  to_a2a: google.adk.a2a.utils.agent_to_a2a.to_a2a
  Tool: tau2.environment.tool.Tool
  ToolProvider: agentbeats.tool_provider.ToolProvider
  TradingAction: defi_agent_eval.green_agent.trading.models.TradingAction
  TradingDecision: defi_agent_eval.green_agent.trading.models.TradingDecision
  TradingEvaluator: defi_agent_eval.green_agent.trading.trading_evaluator.TradingEvaluator
  uvicorn: uvicorn

functions:
  __init__:
    type: sync
    module: agentbeats-integration.scenarios.debate.debate_judge
    args: [self]
  _build_task_prompt:
    type: sync
    module: agentbeats-integration.scenarios.tau2.tau2_evaluator
    args: [self, info, observation]
    params:
      returns: str
  _parse_agent_response:
    type: sync
    module: agentbeats-integration.scenarios.tau2.tau2_evaluator
    args: [self, response]
    params:
      returns: str
  _run_single_task:
    type: async
    module: agentbeats-integration.scenarios.tau2.tau2_evaluator
    args: [self, agent_url, domain, task_id, max_steps, user_llm, user_llm_args]
    params:
      returns: float
  call_agent:
    type: async
    module: agentbeats-integration.scenarios.trading.trading_green
  debate_judge_agent_card:
    type: sync
    module: agentbeats-integration.scenarios.debate.debate_judge_common
    args: [agent_name, card_url]
    params:
      returns: AgentCard
  decision_from_response:
    type: sync
    module: agentbeats-integration.scenarios.trading.trading_green
    args: [resp]
    params:
      returns: TradingDecision
  get_task_ids:
    type: sync
    module: agentbeats-integration.scenarios.tau2.tau2_evaluator
    args: [domain, task_ids, num_tasks]
    params:
      returns: list[str]
  handler:
    type: sync
    module: agentbeats-integration.scenarios.trading.trading_green
    args: [prompt]
    params:
      returns: TradingDecision
  judge_debate:
    type: async
    module: agentbeats-integration.scenarios.debate.debate_judge
    args: [self, topic, debate_text]
    params:
      returns: DebateEval
  main:
    type: sync
    module: agentbeats-integration.scenarios.trading.trading_white
  make_handler:
    type: sync
    module: agentbeats-integration.scenarios.trading.trading_green
    args: [role]
  orchestrate_debate:
    type: async
    module: agentbeats-integration.scenarios.debate.debate_judge
    args: [self, participants, topic, num_rounds, updater]
    params:
      returns: dict
  progress_cb:
    type: sync
    module: agentbeats-integration.scenarios.trading.trading_green
    args: [event]
  progress_pumper:
    type: async
    module: agentbeats-integration.scenarios.trading.trading_green
  run_eval:
    type: async
    module: agentbeats-integration.scenarios.debate.debate_judge
    args: [self, req, updater]
    params:
      returns: None
  run_sync:
    type: sync
    module: agentbeats-integration.scenarios.trading.trading_green
  tau2_evaluator_agent_card:
    type: sync
    module: agentbeats-integration.scenarios.tau2.tau2_evaluator
    args: [name, url]
    params:
      returns: AgentCard
  tools_to_str:
    type: sync
    module: agentbeats-integration.scenarios.tau2.tau2_evaluator
    args: [tools]
    params:
      returns: str
  trading_green_agent_card:
    type: sync
    module: agentbeats-integration.scenarios.trading.trading_green
    args: [url]
    params:
      returns: AgentCard
  turn:
    type: async
    module: agentbeats-integration.scenarios.debate.debate_judge
    args: [role, prompt]
    params:
      returns: str
  validate_request:
    type: sync
    module: agentbeats-integration.scenarios.debate.debate_judge
    args: [self, request]
    params:
      returns: tuple

variables:
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [agentbeats-integration.scenarios.trading.trading_white_custom]
  OPENAI_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [agentbeats-integration.scenarios.trading.trading_white_custom]
  TRADING_JUDGE_MODEL:
    type: env
    params:
      caller: [os.getenv]
      path: [agentbeats-integration.scenarios.trading.trading_white_custom]

files:
  "..":
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), "..", "..", ".."]
